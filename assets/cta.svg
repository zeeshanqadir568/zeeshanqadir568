<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-label="Got a support inbox or a document pile eating your team's day? Send me one line about it. I'll tell you honestly whether AI can fix it, and what it would take. Let's talk.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071226"/><stop offset="0.5" stop-color="#0b1430"/><stop offset="1" stop-color="#1a0b33"/></linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="0.35" stop-color="#34d399"/><stop offset="0.7" stop-color="#f472b6"/><stop offset="1" stop-color="#fbbf24"/></linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="0.5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
    <radialGradient id="gA" cx="0" cy="0" r="0.55"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.25"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="gB" cx="1" cy="0" r="0.55"><stop offset="0" stop-color="#fbbf24" stop-opacity="0.18"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></radialGradient>
    <radialGradient id="gC" cx="0.5" cy="1" r="0.6"><stop offset="0" stop-color="#f472b6" stop-opacity="0.25"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/></radialGradient>
    <filter id="blur" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="12"/></filter>
    <style>
      .t { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      .m { font-family: 'Cascadia Code', Consolas, 'Courier New', monospace; }
      .edge { stroke-dasharray: 360 2780; animation: run 7s linear infinite; }
      .halo { animation: pulse 2.4s ease-in-out infinite; }
      .arrow { animation: nudge 1.2s ease-in-out infinite; }
      .bob { animation: bob 3s ease-in-out infinite; }
      @keyframes run { from { stroke-dashoffset: 3140; } to { stroke-dashoffset: 0; } }
      @keyframes pulse { 0%,100% { opacity: 0.45; } 50% { opacity: 1; } }
      @keyframes nudge { 0%,100% { transform: translateX(0); } 50% { transform: translateX(6px); } }
      @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    </style>
  </defs>
  <rect x="2" y="2" width="1196" height="386" rx="20" fill="url(#bg)"/>
  <rect x="2" y="2" width="1196" height="386" rx="20" fill="url(#gA)"/>
  <rect x="2" y="2" width="1196" height="386" rx="20" fill="url(#gB)"/>
  <rect x="2" y="2" width="1196" height="386" rx="20" fill="url(#gC)"/>
  <rect x="2" y="2" width="1196" height="386" rx="20" fill="none" stroke="#334155" stroke-width="1.5"/>
  <rect class="edge" x="2" y="2" width="1196" height="386" rx="20" fill="none" stroke="url(#ac)" stroke-width="3"/>
  <text class="m" x="600" y="58" font-size="14" fill="#fbbf24" letter-spacing="3" text-anchor="middle">LET'S FIX ONE THING THIS MONTH</text>
  <text class="t" x="600" y="112" font-size="38" font-weight="700" fill="#f8fafc" text-anchor="middle">Got a support inbox or a document pile</text>
  <text class="t" x="600" y="158" font-size="38" font-weight="700" fill="url(#ac)" text-anchor="middle">eating your team's day?</text>
  <text class="t" x="600" y="200" font-size="19" fill="#cbd5e1" text-anchor="middle">Send me one line about it. I'll tell you honestly whether AI can fix it, and what it would take.</text>
  <g class="bob" style="animation-delay:0.00s"><rect x="208" y="226" width="181" height="36" rx="18" fill="#22d3ee" fill-opacity="0.14" stroke="#22d3ee" stroke-opacity="0.7" stroke-width="1.5"/><circle cx="228" cy="244" r="5" fill="#22d3ee"/><text class="t" x="242" y="250" font-size="16" font-weight="600" fill="#f1f5f9">Support inbox</text></g><g class="bob" style="animation-delay:0.45s"><rect x="403" y="226" width="190" height="36" rx="18" fill="#fbbf24" fill-opacity="0.14" stroke="#fbbf24" stroke-opacity="0.7" stroke-width="1.5"/><circle cx="423" cy="244" r="5" fill="#fbbf24"/><text class="t" x="437" y="250" font-size="16" font-weight="600" fill="#f1f5f9">PDFs and forms</text></g><g class="bob" style="animation-delay:0.90s"><rect x="607" y="226" width="200" height="36" rx="18" fill="#f472b6" fill-opacity="0.14" stroke="#f472b6" stroke-opacity="0.7" stroke-width="1.5"/><circle cx="627" cy="244" r="5" fill="#f472b6"/><text class="t" x="641" y="250" font-size="16" font-weight="600" fill="#f1f5f9">Copy-paste work</text></g><g class="bob" style="animation-delay:1.35s"><rect x="821" y="226" width="171" height="36" rx="18" fill="#34d399" fill-opacity="0.14" stroke="#34d399" stroke-opacity="0.7" stroke-width="1.5"/><circle cx="841" cy="244" r="5" fill="#34d399"/><text class="t" x="855" y="250" font-size="16" font-weight="600" fill="#f1f5f9">Missed leads</text></g>
  <g transform="translate(460 296)">
    <rect class="halo" x="0" y="0" width="280" height="62" rx="31" fill="url(#btn)" filter="url(#blur)"/>
    <rect x="0" y="0" width="280" height="62" rx="31" fill="url(#btn)"/>
    <circle cx="40" cy="31" r="21" fill="#ffffff"/>
    <g transform="translate(26.5 20.8) scale(0.1055)">
      <path fill="#4285F4" d="M58.182 192.05V93.14L27.507 65.077 0 49.504v125.091c0 9.658 7.825 17.455 17.455 17.455h40.727Z"/>
      <path fill="#34A853" d="M197.818 192.05h40.727c9.659 0 17.455-7.826 17.455-17.455V49.505l-31.156 17.837-27.026 25.798v98.91Z"/>
      <path fill="#EA4335" d="m58.182 93.14-4.174-38.647 4.174-36.989L128 69.868l69.818-52.364 4.67 34.992-4.67 40.644L128 145.504z"/>
      <path fill="#FBBC04" d="M197.818 17.504V93.14L256 49.504V26.231c0-21.585-24.64-33.89-41.89-20.945l-16.292 12.218Z"/>
      <path fill="#C5221F" d="M0 49.504l26.759 20.07L58.182 93.14V17.504L41.89 5.286C24.61-7.66 0 4.646 0 26.23v23.273Z"/>
    </g>
    <text class="t" x="76" y="39" font-size="23" font-weight="800" fill="#0b1022">Let's talk</text>
    <g class="arrow"><path d="M214 31 h26 m-9 -9 l9 9 l-9 9" fill="none" stroke="#0b1022" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-label="How I build: your data, retrieve, AI drafts, verify, a human approves, logged and shipped.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0b1022"/><stop offset="1" stop-color="#120b26"/></linearGradient>
    <linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="0.5" stop-color="#818cf8"/><stop offset="1" stop-color="#e879f9"/></linearGradient>
    <style>
      .t { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      .m { font-family: 'Cascadia Code', Consolas, 'Courier New', monospace; }
      .box { fill: #0f172a; stroke: #334155; stroke-width: 1.5; }
      .hi { animation: hi 7s linear infinite; }
      @keyframes hi { 0%,100% { stroke: #334155; } 6%,12% { stroke: #22d3ee; } 18% { stroke: #334155; } }
    </style>
  </defs>
  <rect x="1" y="1" width="1198" height="198" rx="16" fill="url(#bg)" stroke="#334155"/>
  <text class="m" x="40" y="40" font-size="13" fill="#67e8f9" letter-spacing="2">HOW I BUILD</text>
  <line x1="120" y1="118" x2="1080" y2="118" stroke="url(#ln)" stroke-width="2" stroke-opacity="0.5"/>
  <circle r="7" cy="118" fill="#f8fafc">
    <animate attributeName="cx" values="120;1080" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.95;1" dur="7s" repeatCount="indefinite"/>
  </circle>
  <g class="t" text-anchor="middle">
    <g><rect class="box hi" x="40" y="88" width="160" height="60" rx="12"/><text x="120" y="114" font-size="17" font-weight="600" fill="#f8fafc">Your data</text><text x="120" y="134" font-size="13" fill="#94a3b8">docs, orders, FAQs</text></g>
    <g><rect class="box hi" style="animation-delay:1.1s" x="232" y="88" width="160" height="60" rx="12"/><text x="312" y="114" font-size="17" font-weight="600" fill="#f8fafc">Retrieve</text><text x="312" y="134" font-size="13" fill="#94a3b8">hybrid search</text></g>
    <g><rect class="box hi" style="animation-delay:2.2s" x="424" y="88" width="160" height="60" rx="12"/><text x="504" y="114" font-size="17" font-weight="600" fill="#f8fafc">AI drafts</text><text x="504" y="134" font-size="13" fill="#94a3b8">with sources</text></g>
    <g><rect class="box hi" style="animation-delay:3.3s" x="616" y="88" width="160" height="60" rx="12"/><text x="696" y="114" font-size="17" font-weight="600" fill="#f8fafc">Verify</text><text x="696" y="134" font-size="13" fill="#94a3b8">guardrails + tests</text></g>
    <g><rect class="box hi" style="animation-delay:4.4s" x="808" y="88" width="160" height="60" rx="12"/><text x="888" y="114" font-size="17" font-weight="600" fill="#f8fafc">Human approves</text><text x="888" y="134" font-size="13" fill="#94a3b8">no blind automation</text></g>
    <g><rect class="box hi" style="animation-delay:5.5s" x="1000" y="88" width="160" height="60" rx="12"/><text x="1080" y="114" font-size="17" font-weight="600" fill="#f8fafc">Logged</text><text x="1080" y="134" font-size="13" fill="#94a3b8">full audit trail</text></g>
  </g>
</svg>

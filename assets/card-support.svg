<svg xmlns="http://www.w3.org/2000/svg" width="560" height="250" viewBox="0 0 560 250" role="img" aria-label="AI Customer Support Agent: Looks up real order data with tools, resolves what it safely can, and hands the rest to a human.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1022"/><stop offset="1" stop-color="#120b26"/></linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#818cf8"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <radialGradient id="gl" cx="1" cy="0" r="0.8"><stop offset="0" stop-color="#818cf8" stop-opacity="0.25"/><stop offset="1" stop-color="#818cf8" stop-opacity="0"/></radialGradient>
    <style>
      .t { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      .m { font-family: 'Cascadia Code', Consolas, 'Courier New', monospace; }
      .edge { stroke-dasharray: 120 1640; animation: run 6s linear infinite; animation-delay: -1.5s; }
      @keyframes run { from { stroke-dashoffset: 1760; } to { stroke-dashoffset: 0; } }
    </style>
  </defs>
  <rect x="1" y="1" width="558" height="248" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="558" height="248" rx="16" fill="url(#gl)"/>
  <rect x="1" y="1" width="558" height="248" rx="16" fill="none" stroke="#334155" stroke-width="1.5"/>
  <rect class="edge" x="1" y="1" width="558" height="248" rx="16" fill="none" stroke="url(#ac)" stroke-width="2.5"/>
  <rect x="32" y="30" width="44" height="4" rx="2" fill="url(#ac)"/>
  <text class="m" x="86" y="36" font-size="13" fill="#818cf8" letter-spacing="2">AI AGENT</text>
  <text class="t" x="32" y="80" font-size="26" font-weight="700" fill="#f8fafc">AI Customer Support Agent</text>
  <text class="t" x="32" y="118" font-size="16" fill="#94a3b8">Looks up real order data with tools, resolves what</text>
  <text class="t" x="32" y="142" font-size="16" fill="#94a3b8">it safely can, and hands the rest to a human.</text>
  <rect x="32" y="186" width="131" height="28" rx="14" fill="#818cf8" fill-opacity="0.12" stroke="#818cf8" stroke-opacity="0.45"/><text class="t" x="97.5" y="205" font-size="14" fill="#e2e8f0" text-anchor="middle">Anthropic API</text><rect x="171" y="186" width="90" height="28" rx="14" fill="#818cf8" fill-opacity="0.12" stroke="#818cf8" stroke-opacity="0.45"/><text class="t" x="216" y="205" font-size="14" fill="#e2e8f0" text-anchor="middle">Tool use</text><rect x="269" y="186" width="114" height="28" rx="14" fill="#818cf8" fill-opacity="0.12" stroke="#818cf8" stroke-opacity="0.45"/><text class="t" x="326" y="205" font-size="14" fill="#e2e8f0" text-anchor="middle">Audit trail</text><rect x="391" y="186" width="73" height="28" rx="14" fill="#818cf8" fill-opacity="0.12" stroke="#818cf8" stroke-opacity="0.45"/><text class="t" x="427.5" y="205" font-size="14" fill="#e2e8f0" text-anchor="middle">Python</text>
  <text class="t" x="528" y="36" font-size="14" font-weight="600" fill="#818cf8" text-anchor="end">View code  →</text>
